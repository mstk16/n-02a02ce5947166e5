<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>配信メモ</title>
<meta name="description" content="配信を見ながら見どころ・気になる場面をワンタップで記録できるメモアプリ">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="配信メモ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#0d0f14;
    --panel:#161922;
    --panel2:#1d212c;
    --border:#2a2f3c;
    --text:#f1f3f6;
    --sub:#9aa3b2;
    --accent:#1d9bf0;
    --accent-dim:#144a70;
    --danger:#f4405a;
    /* env(safe-area-inset-*)はWebView内だと実機の黒帯・カメラの穴・ジェスチャーナビ等を
       正確に反映しないコトがあるため、常に少し余分に足しておく(削れるより
       余白が少し多い方がマシ・Z Fold実機で端が隠れて操作できない不具合の対策) */
    --safe-b: calc(env(safe-area-inset-bottom, 0px) + 16px);
    --safe-t: calc(env(safe-area-inset-top, 0px) + 10px);
    --safe-l: calc(env(safe-area-inset-left, 0px) + 12px);
    --safe-r: calc(env(safe-area-inset-right, 0px) + 12px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
    overscroll-behavior-y:none;
  }
  #root{height:100dvh;}

  /* 横長/正方形に近い広い画面(分割画面の片側など)ではシアターモードにする:
     動画+チャットを左、アプリ本体を右の2ペインにする。
     ⚠2026-09-04: 一時700px→1000pxに変更したが、Z Fold 7全開(≈984px)でこそ
     動画を大きく見る2ペイン表示を実際に使っていた(ユーザー実機確認)ため、
     ユーザーに未確認のままエージェントの推測(「メモ欄が狭くなる」)だけで
     動かしたのは誤りだった。700pxへ戻す。閾値を変える場合は
     必ず実際の使い方をユーザーに確認してから変えること。 */
  @media (min-width:700px){
    /* 元は動画側1.15fr:メモ側1fr(動画優先)だったが、クイック追加バー等の
       入力欄が増えてメモ側が窮屈という指摘(2026-09-06)を受け、メモ側を
       広くする比率に変更する。
       ⚠grid-template-columnsの2列(0.85fr/1.15fr)にサイズを持たせて
       orderで中身を列間移動する方式だと、「列」にサイズが紐づくため
       入れ替えると幅まで一緒に入れ替わってしまう(2026-09-06発覚:
       「配置の大きさはそのまま、位置だけ入れ替えたい」という指示に反する)。
       displayをflexにし、各要素自身にflex-basisを持たせることで、
       サイズを中身(メモ=狭い/チャット=広い)に固定し、orderは純粋に
       左右の位置だけを動かすようにする */
    #root{display:flex; height:100dvh;}
    #videoPane{
      display:flex; flex-direction:column; height:100dvh; min-width:0;
      flex:1.15 1.15 0%;
      border-right:1px solid var(--border); background:#000;
    }
    .video-box{flex:0 0 auto;}
    /* 動画が連携されていない間は#videoPane自体が非表示(.hidden)になるので、
       空のチャット欄がflex:1で場所を占領して#homeViewを潰さないよう、
       動画連携中(#root.video-split)だけ広がるようにする(2026-09-07発覚:
       動画未連携+広い画面で#homeViewがほぼ0高さに潰れるバグの原因) */
    #root.video-split .chat-box{flex:1 1 auto; min-height:0; background:var(--bg);}
    .chat-box iframe{width:100%; height:100%; border:0; display:block;}
    /* メモカード(#quickMemoCard)の移動先。動画の下・チャットの反対側に
       常に置く(ユーザー指示2026-09-06)。チャット自体は#app側に常駐する
       ので、コンパクトモードへ戻すときも動かすのはコレだけでいい */
    #videoPaneMemoSlot{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
    /* 内画面ではJSが#controlsGroupをこの下(チャットの下)へ移動してくる。
       fixed/absoluteのままだとvideoPaneのflex columnに参加できないので
       通常の(位置指定なしの)ブロックに戻す。チャット欄が狭くなるのは
       ユーザー指示どおり(flex:1のchat-boxが自動で譲る)。
       ⚠ID+子孫クラスのセレクタなので、無印の.tag-bar{position:fixed}等より
       詳細度で確実に勝つ(ソース順に依存しない) */
    #videoPane{ overflow:hidden; }
    #videoPane #controlsGroup{ flex:0 0 auto; }
    #videoPane .tag-bar, #videoPane .quick-add-bar, #videoPane .action-bar{
      position:static; max-width:none; margin:0; left:auto; right:auto; bottom:auto;
    }
    /* #appのmax-width解除は、後段の#app{max-width:560px}(通常時ルール)より
       ソース順で後にある@media(min-width:700px)ブロックの方に書いてある
       (ここに書いても後勝ちの通常ルールに上書きされて効かないため)。 */
    /* フローティングキーボードが出る側に応じて、メモとチャット(動画)の左右を
       入れ替えられるように(⚙設定から切替)。DOM順は変えずflexのorderだけ動かす。
       各要素は自分自身にflex-basisを持つ(上記)ので、orderで位置を動かしても
       サイズは中身に固定されたまま入れ替わらない */
    #root.swap-panes #videoPane{ order:2; border-right:none; border-left:1px solid var(--border); }
    #root.swap-panes #app{ order:1; }
  }

  #app{
    max-width:560px; margin:0 auto; height:100dvh;
    display:flex; flex-direction:column; position:relative;
  }
  .iconbtn{
    background:none; border:none; color:var(--sub); font-size:20px;
    padding:6px 8px; border-radius:8px; cursor:pointer;
  }
  .iconbtn:active{background:var(--panel2);}
  .iconbtn.pressing{background:var(--accent-dim); color:var(--accent);}

  .view{flex:1 1 auto; overflow-y:auto; padding:var(--safe-t) var(--safe-r) calc(212px + var(--safe-b)) var(--safe-l); display:flex; flex-direction:column;}
  .view.hidden{display:none;}
  /* 常時見えるスクロールバー。Chromium系では効くが、モバイルのタッチスクロールでは
     OS側が自動で細い一時表示バーに差し替えてしまい、反映されないコトがある */
  .view{ scrollbar-width:auto; scrollbar-color: var(--sub) var(--panel2); }
  .view::-webkit-scrollbar{ width:12px; }
  .view::-webkit-scrollbar-track{ background:var(--panel2); }
  .view::-webkit-scrollbar-thumb{ background:var(--sub); border-radius:999px; border:2px solid var(--panel2); }
  .view::-webkit-scrollbar-thumb:active{ background:var(--accent); }
  .view::-webkit-scrollbar-button{ display:block; height:14px; background:var(--panel2); }
  .view::-webkit-scrollbar-button:vertical:start:decrement{
    background:var(--panel2); border-bottom:5px solid var(--sub); border-left:5px solid transparent; border-right:5px solid transparent; height:0; margin:5px auto;
  }
  .view::-webkit-scrollbar-button:vertical:end:increment{
    background:var(--panel2); border-top:5px solid var(--sub); border-left:5px solid transparent; border-right:5px solid transparent; height:0; margin:5px auto;
  }

  .session-title{font-size:17px; font-weight:700; word-break:break-word;}
  .session-url{font-size:12px; color:var(--sub); margin-top:2px; word-break:break-all;}
  .session-hint{color:var(--sub); font-size:13px; line-height:1.6;}
  .session-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--border); background:var(--panel2); color:var(--text);
    padding:9px 14px; border-radius:10px; font-size:13.5px; cursor:pointer;
  }
  .btn:active{opacity:.7;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  .btn.danger{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%; padding:12px; font-size:15px;}
  .btn[disabled]{opacity:.4; pointer-events:none;}

  .section-label{font-size:12px; color:var(--sub); margin:4px 2px 8px; font-weight:600;}

  /* 動画プレビュー。以前はコンパクト表示(折りたたみ時)だけ右上の小さい
     浮きバッジ(.yt-float)にしていたが、「動画は横幅フルで、チャット欄が
     ないだけの見た目にしてほしい」という指示(2026-09-07)を受け、
     コンパクト/内画面(シアター)どちらも同じ#videoPane/.video-boxを使う
     統一デザインに変更する。#videoPaneは#root直下の最初の子なので、
     コンパクト時は自然に画面最上部に横幅いっぱいで並ぶ(#appがその下に続く)。
     連携が無い間は#videoPaneごと隠す。 */
  #videoPane.hidden{display:none;}
  .video-box{width:100%; aspect-ratio:16/9; background:#000; overflow:hidden;}
  .video-box iframe, .video-box > div{width:100%; height:100%;}
  .yt-status{font-size:12.5px; color:var(--accent); font-weight:700;}
  .yt-offset-row{display:flex; gap:6px;}
  .yt-offset-row .adjust{padding:6px 10px; font-size:12px;}
  .yt-settings{margin-top:6px;}
  .yt-settings.hidden{display:none;}
  .yt-settings .yt-status{margin-bottom:8px;}
  .yt-settings .yt-offset-row{margin-bottom:8px;}

  /* 画面全部をメモ欄にする(1配信=1つの連続テキスト。一覧・個別カードは無い)。
     #homeViewがflex-columnなので、このカードがflex:1で縦幅を全部吸う */
  #homeView{flex:1 1 auto; min-height:0;}
  .quick-memo-card{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
  .quick-memo-card.hidden{display:none;}
  .quick-memo-card textarea{
    flex:1 1 auto; width:100%; height:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:14px; padding:14px; font-size:16px; line-height:1.6; font-family:inherit; resize:none;
  }
  .quick-memo-card textarea:focus{outline:2px solid var(--accent); outline-offset:0;}

  .chip{
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    padding:9px 14px; border-radius:999px; font-size:13.5px; cursor:pointer;
    display:flex; align-items:center; gap:4px;
    /* 長押しでその場編集にしたいので、端末側のテキスト選択/コピーメニューが
       先に割り込まないようにする(2026-09-07: 長押しで端末デフォルトの
       メニューが出て編集できないという指摘で追加) */
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  .chip:active{background:var(--panel2); transform:scale(.97);}
  .chip.add{color:var(--sub); border-style:dashed;}
  .chip.selected{background:var(--accent-dim); border-color:var(--accent); color:#fff;}
  .chip.pressing{background:var(--accent-dim); border-color:var(--accent);}

  .memo-list{display:flex; flex-direction:column; gap:8px;}
  .memo-item{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:10px 12px; cursor:pointer;
  }
  .memo-item:active{background:var(--panel2);}
  .memo-row{display:flex; align-items:baseline; gap:8px;}
  .memo-t{
    font-variant-numeric:tabular-nums; color:var(--accent); font-weight:700; font-size:13px; flex:0 0 auto;
  }
  .memo-text{font-size:14.5px; line-height:1.5; flex:1 1 auto; word-break:break-word; white-space:pre-wrap;}
  .memo-text.empty{color:var(--sub); font-style:italic;}
  .memo-tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .tag-pill{
    font-size:11px; color:var(--sub); background:var(--panel2); border:1px solid var(--border);
    border-radius:999px; padding:2px 8px;
  }
  .empty-state{color:var(--sub); font-size:13.5px; text-align:center; padding:40px 20px; line-height:1.8;}

  /* 操作は全部この下帯1本に集約。タグ列だけ横スクロールさせ、記録・ナビ・設定は
     常に見える位置(左端/右端)に固定する */
  .action-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    max-width:560px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px var(--safe-r) calc(8px + var(--safe-b)) var(--safe-l);
    border-top:1px solid var(--border); background:var(--bg);
  }
  .record-chip{
    flex:0 0 auto; background:var(--accent); color:#fff;
    border:none; border-radius:999px; width:40px; height:40px;
    font-size:19px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .record-chip:active{opacity:.8;}
  .record-chip.hidden{display:none;}
  .action-bar-nav{flex:0 0 auto; display:flex; align-items:center; gap:2px;}
  .navchip{
    flex:0 0 auto; background:none; border:none; color:var(--sub); font-size:19px;
    padding:6px 8px; border-radius:8px; cursor:pointer;
  }
  .navchip.active{color:var(--accent);}
  .navchip:active, .iconbtn:active{background:var(--panel2);}

  /* タグ専用の行。下帯(action-bar)のさらに上に重ねる */
  .tag-bar{
    position:fixed; left:0; right:0; bottom:calc(56px + var(--safe-b)); z-index:19;
    max-width:560px; margin:0 auto;
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:8px var(--safe-r) 8px var(--safe-l); border-top:1px solid var(--border); background:var(--bg);
  }
  .tag-bar::-webkit-scrollbar{display:none;}
  .tag-bar.hidden{display:none;}

  /* PC版(ymmp_gui_new.py)の配信メモ入力欄と同じ考え方: 1行入力してEnter/追加で
     タイムスタンプ付きの1行として末尾に追記され、欄はクリアされて次を打てる。
     連続テキスト(quickMemoText)への「もう1つの書き方」として共存させる。
     tag-barのさらに上に重ねる */
  .quick-add-bar{
    position:fixed; left:0; right:0; bottom:calc(112px + var(--safe-b)); z-index:18;
    max-width:560px; margin:0 auto;
    display:flex; flex-direction:column; gap:6px;
    padding:8px var(--safe-r) 6px var(--safe-l); border-top:1px solid var(--border); background:var(--bg);
  }
  .quick-add-bar.hidden{display:none;}
  .quick-add-row{display:flex; gap:6px; align-items:center;}
  .quick-add-row input{
    flex:1 1 auto; background:var(--panel2); border:1px solid var(--accent); color:var(--text);
    border-radius:10px; padding:9px 12px; font-size:14px; font-family:inherit;
  }
  .quick-add-row input:focus{outline:none;}
  .quick-add-row.guest input{border-color:#e05a9e;}
  .quick-add-row .btn{padding:9px 14px; font-size:13px; flex:0 0 auto;}

  .session-list{display:flex; flex-direction:column; gap:10px;}
  .session-row{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:14px; cursor:pointer;
  }
  .session-row:active{background:var(--panel2);}
  .session-row .t1{font-weight:700; font-size:15px; word-break:break-word;}
  .session-row .t2{font-size:12px; color:var(--sub); margin-top:4px;}
  .session-row .live{color:var(--accent); font-weight:700;}

  .detail-header{margin-bottom:14px;}
  .detail-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .detail-note-text{
    white-space:pre-wrap; word-break:break-word; font-size:14.5px; line-height:1.7;
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:14px;
  }

  /* シート(モーダル) */
  .sheet{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .sheet.hidden{display:none;}
  .sheet-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55);}
  .sheet-panel{
    position:relative; width:100%; max-width:560px; background:var(--panel);
    border-radius:20px 20px 0 0; padding:16px var(--safe-r) calc(20px + var(--safe-b)) var(--safe-l);
    border:1px solid var(--border); border-bottom:none;
    max-height:85dvh; overflow-y:auto;
  }
  .sheet-title{font-size:15px; font-weight:700; margin-bottom:12px;}
  .sheet-time{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;}
  .sheet-time .t{
    font-variant-numeric:tabular-nums; font-size:30px; font-weight:800; color:var(--accent);
    min-width:120px; text-align:center; cursor:pointer;
  }
  .settings-elapsed{
    font-variant-numeric:tabular-nums; font-size:26px; font-weight:800; color:var(--accent);
    margin-bottom:14px;
  }
  .settings-end-row{margin-top:18px;}
  .adjust{
    border:1px solid var(--border); background:var(--panel2); color:var(--text);
    border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer;
  }
  textarea, input[type=text], input[type=url], input[type=time]{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit; resize:none;
  }
  textarea:focus, input:focus{outline:2px solid var(--accent); outline-offset:0;}
  .field-label{font-size:12px; color:var(--sub); margin:12px 2px 6px;}
  .tag-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .add-tag-row{display:flex; gap:8px; margin-top:10px;}
  .add-tag-row input{flex:1;}
  .sheet-buttons{display:flex; gap:10px; margin-top:18px;}
  .sheet-buttons .btn{flex:1;}

  .toast{
    position:fixed; left:50%; bottom:calc(150px + var(--safe-b)); transform:translateX(-50%);
    background:#2a2f3c; color:#fff; padding:10px 16px; border-radius:999px; font-size:13.5px;
    display:flex; align-items:center; gap:10px; z-index:60; box-shadow:0 4px 16px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .toast.show{opacity:1; pointer-events:auto;}
  .toast button{background:none; border:none; color:var(--accent); font-weight:700; font-size:13.5px; cursor:pointer;}

  /* シアターモードでは#appが右ペインだけになるので、トースト等のfixed系UIも
     画面全体ではなく#app基準(position:relative)に収める。操作系(タグ行・
     クイック追加バー・下帯)は#controlsGroupごとJSで#videoPane側へ移動
     するので、ここでは対象にしない(上のvideoPane向けルールで別途リセット
     済み・2026-09-06) */
  @media (min-width:700px){
    /* ⚠#app{max-width:560px}という通常時ルールがコレより後(ソース順で下)に
       あるため、同じ詳細度では後勝ちでこの上書きが無視され、シアターモードでも
       #appが560px上限のまま伸びずグリッド列の中で狭く縮んでいた
       (2026-09-06発覚「メモ画面が狭すぎ」の真因。列の比率だけ直しても
       この上限に阻まれて効かなかった)。ここ(通常#appルールより後)に
       書くことで確実に上書きする */
    #app{max-width:none; margin:0; flex:0.85 0.85 0%; min-width:0;}
    /* #homeViewの中身(メモカード)は動画連携中だけJSで#videoPaneMemoSlotへ
       移動する(video-split時)。#root.video-splitスコープを付けたのは、
       動画未連携時にも無条件でここが効くと#homeViewが潰れてしまうため
       (2026-09-07発覚)。無印の#homeView{flex:1 1 auto}(ベースルール・161行目
       付近)と同じ詳細度(ID)なので、それより後のここに書いて確実に上書きする。 */
    #root.video-split #homeView{flex:0 0 auto; min-height:0;}
    .toast{position:absolute;}
    /* 操作を#videoPane側へ出した分(video-split時のみ)、#appのメモ欄は
       もう下帯ぶんの余白を確保しなくていい。動画未連携時は操作が#app内に
       残るので、通常どおりの余白(下の.viewベースルール)のままにする */
    #root.video-split .view{padding-bottom:calc(14px + var(--safe-b));}
    /* 内画面(Z Fold展開等の広い画面)では🕐が左端・他が右端に離れていると
       親指移動が大きくて押しにくい。ユーザー指示で全部右側に寄せる */
    .action-bar{justify-content:flex-end;}
  }

  .yt-api-key-row.hidden{display:none;}
  .yt-search-results{display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height:280px; overflow-y:auto;}
  .yt-search-item{
    display:flex; gap:8px; align-items:center; background:var(--panel2); border:1px solid var(--border);
    border-radius:10px; padding:6px; cursor:pointer;
  }
  .yt-search-item:active{opacity:.7;}
  .yt-search-item img{width:64px; height:36px; object-fit:cover; border-radius:6px; flex:0 0 auto; background:#000;}
  .yt-search-item-info{min-width:0;}
  .yt-search-item-title{font-size:13px; font-weight:600; word-break:break-word; line-height:1.4;}
  .yt-search-item-channel{font-size:11px; color:var(--sub); margin-top:2px;}

  .switch-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-top:8px; font-size:13.5px; cursor:pointer;
  }
  .switch-row input{width:auto; accent-color:var(--accent);}

  .tag-set-list{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
  .tag-set-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:8px 10px;
  }
  .tag-set-row.active{border-color:var(--accent);}
  .tag-set-name{font-size:14px; word-break:break-all;}
  .tag-set-row.active .tag-set-name{color:var(--accent); font-weight:700;}
  .tag-set-actions{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
  .tag-set-actions .btn{padding:6px 10px; font-size:12.5px;}

  .tag-manage-list{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
  .tag-manage-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:8px 10px;
  }
  .tag-manage-text{font-size:14px; word-break:break-all;}
  .tag-manage-del{
    flex:0 0 auto; background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer; padding:2px 6px;
  }
  .tag-manage-del:active{color:var(--danger);}
</style>

<body>
<div id="root">
<div id="videoPane">
  <div class="video-box"><div id="ytPlayerHostBig"></div></div>
  <!-- 内画面(シアターモード)ではJSが#quickMemoCardを#appからここへ移動する
       (ユーザー指示2026-09-06: 動画は右上のまま、チャットとメモの位置を
       入れ替えたい)。チャット自体は常に#appChatSlot側に置くので、コレは
       メモカードの移動先スロットだけでいい */ -->
  <div id="videoPaneMemoSlot"></div>
  <!-- 内画面ではここに#controlsGroupが移動してくる(JS側で制御)。
       チャットの下に操作を置きたい、というユーザー指示(2026-09-06)への対応 -->
</div>
<div id="app">

  <!-- チャットは常にここ(#app側)に置く。内画面(シアターモード)でだけ
       renderChatEmbed()が中身を埋める(コンパクトモードでは空のまま=
       どこに置いても見た目に影響しないので、コンパクト時の移動は不要) -->
  <div class="chat-box" id="ytChatWrap"></div>

  <!-- ホーム(記録)画面。1配信=1つの連続テキスト。🕐は今のカーソル位置に
       時刻を挿入するだけ(タグ挿入と同じ仕組み)。一覧・個別カードは持たない。
       内画面ではJSがコレを#videoPaneMemoSlotへ移動する。 -->
  <main class="view" id="homeView">
    <div class="quick-memo-card" id="quickMemoCard">
      <textarea id="quickMemoText" placeholder="ここに自由に書きながら見て、下のタグでテキスト挿入・右下のタイムスタンプで今の時刻を挿入"></textarea>
    </div>
  </main>

  <!-- 履歴画面 -->
  <main class="view hidden" id="historyView">
    <div class="section-label">配信履歴</div>
    <div class="session-list" id="sessionList"></div>
  </main>

  <!-- 履歴の配信詳細画面 -->
  <main class="view hidden" id="detailView">
    <button class="btn ghost" id="backToHistoryBtn">← 履歴に戻る</button>
    <div class="detail-header" id="detailHeader"></div>
    <div class="memo-list" id="detailMemoList"></div>
  </main>

  <!-- 操作をまとめて動かせるように1つにグルーピングする(2026-09-06)。
       内画面(シアターモード)ではJSがコレを丸ごと#videoPane(チャットの下)へ
       移動する。通常時はここ(#controlsHomeAnchorの直後)が定位置 -->
  <div id="controlsHomeAnchor" style="display:none"></div>
  <div id="controlsGroup">
    <!-- タグ専用の行(記録画面のときだけ表示) -->
    <div class="tag-bar" id="quickTagsWrap"></div>

    <!-- クイック追加バー(記録画面のときだけ表示)。PC版と同じくEnter/追加で
         タイムスタンプ付きの1行として末尾に追記し、欄はクリアされる -->
    <div class="quick-add-bar" id="quickAddBar">
      <div class="quick-add-row">
        <input type="text" id="quickAddMemoInput" placeholder="配信中のメモをここに（Enterで追加）">
        <button class="btn primary" id="quickAddMemoBtn">追加</button>
      </div>
      <div class="quick-add-row guest">
        <input type="text" id="quickAddGuestInput" placeholder="ゲストのセリフをここに（Enterで追加）">
        <button class="btn" id="quickAddGuestBtn">追加</button>
      </div>
    </div>

    <!-- 操作はこの下帯に集約。設定は常に一番右 -->
    <nav class="action-bar" id="actionBar">
      <button class="record-chip" id="recordBtn" aria-label="この瞬間を記録">🕐</button>
      <div class="action-bar-nav">
        <button class="navchip active" id="navHomeBtn" data-view="home" aria-label="記録">📝</button>
        <button class="navchip" id="navHistoryBtn" data-view="history" aria-label="履歴">📚</button>
        <button class="iconbtn" id="settingsBtn" aria-label="設定">⚙</button>
      </div>
    </nav>
  </div>

  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button id="toastAction" style="display:none;"></button>
  </div>
</div>
</div><!-- /#root -->

<!-- 設定シート(タイトル/URLは自動で決まるので手入力欄は置かない) -->
<div class="sheet hidden" id="sessionSheet">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel">
    <div class="sheet-title">設定</div>
    <div class="settings-elapsed" id="timerDisplay">00:00</div>

    <div class="field-label">画面レイアウト（横長の分割表示のときだけ）</div>
    <label class="switch-row" for="swapPanesToggle">
      <span>チャット/動画とメモの左右を入れ替える</span>
      <input type="checkbox" id="swapPanesToggle">
    </label>
    <div class="session-hint" style="margin-top:4px;">フローティングキーボードが出る側にメモが隠れる場合、反対側に逃がすために使う。</div>

    <div class="field-label">PC連携（任意・自宅PCの配信メモ拡張機能へ差分を自動送信）</div>
    <div class="add-tag-row">
      <input type="text" id="pcSyncKeyInput" placeholder="PC連携キー（PC側config.jsonと同じ文字列）">
    </div>
    <div class="add-tag-row" style="margin-top:8px;">
      <input type="text" id="pcSyncHostInput" placeholder="PC接続先（例：192.168.1.23:8765）">
    </div>
    <div class="add-tag-row" style="margin-top:8px;">
      <button class="btn" id="pcSyncSaveBtn">保存</button>
    </div>
    <div class="session-hint" id="pcSyncStatusText" style="margin-top:4px;"></div>

    <div id="ytLinkSection">
      <div class="field-label">YouTube連携（任意・経過時間を自動取得）</div>
      <div class="add-tag-row">
        <input type="text" id="ytUrlInput" placeholder="配信のYouTube URLを貼り付け">
        <button class="btn" id="ytLinkBtn">連携</button>
      </div>
      <div class="add-tag-row" style="margin-top:8px;">
        <input type="text" id="ytSearchInput" placeholder="または検索して開く">
        <button class="btn" id="ytSearchBtn">検索</button>
      </div>
      <div class="yt-search-results" id="ytSearchResults"></div>
      <button type="button" class="btn ghost" id="ytApiKeyToggleBtn" style="margin-top:6px; font-size:12px; padding:6px 10px;">検索用APIキーを設定</button>
      <div class="yt-api-key-row hidden" id="ytApiKeyRow">
        <div class="add-tag-row">
          <input type="text" id="ytApiKeyInput" placeholder="AIza...（YouTube Data API v3キー）">
          <button class="btn" id="ytApiKeySaveBtn">保存</button>
        </div>
      </div>
    </div>
    <div class="yt-settings hidden" id="ytSettingsBox">
      <div class="field-label">YouTube連携</div>
      <div class="yt-status" id="ytStatusText">読み込み中…</div>
      <div class="yt-offset-row">
        <button class="adjust" id="ytOffsetMinus">-5秒</button>
        <button class="adjust" id="ytOffsetPlus">+5秒</button>
      </div>
      <button class="btn ghost" id="ytUnlinkBtn">連携解除</button>
    </div>

    <div class="field-label">ワードボタンのセット（「セット」を押した1つだけがメモ下に出る）</div>
    <div class="tag-set-list" id="tagSetList"></div>
    <div class="add-tag-row">
      <input type="text" id="newTagSetInput" placeholder="新しいセット名（例：雑談用）">
      <button class="btn" id="addTagSetBtn">追加</button>
    </div>

    <div class="field-label">「<span id="activeTagSetName"></span>」の中身</div>
    <div class="tag-manage-list" id="tagManageList"></div>
    <div class="add-tag-row">
      <input type="text" id="newPresetTagInput" placeholder="例：◆感想◇">
      <button class="btn" id="addPresetTagBtn">追加</button>
    </div>

    <div class="sheet-buttons settings-end-row">
      <button class="btn danger" id="endSessionBtn" style="display:none;">配信を終了して保存</button>
    </div>
    <div class="sheet-buttons">
      <button class="btn ghost" id="helpBtn">使い方</button>
      <button class="btn primary" id="cancelSessionBtn">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'haisin-memo-v1';
  var DEFAULT_TAGS = ['◆◇','◆キャラ◇','◆語尾◇','◆かわいい◇','◆◇◆◇◆◇'];

  function freshState(){
    return {
      sessions: [], activeSessionId: null,
      tagSets: [{ id: 'default', name: 'デフォルト', tags: DEFAULT_TAGS.slice() }],
      activeTagSetId: 'default',
      ytApiKey: '',
      swapPanes: false,
      pcSyncKey: '',
      pcSyncHost: '',
      pcLastSyncAt: null
    };
  }
  // 旧バージョン(タグがtagPresetsのフラット配列だった頃)からの移行
  function migrateTagSets(s){
    if(s.tagSets && s.tagSets.length) return;
    s.tagSets = [{ id: 'default', name: 'デフォルト', tags: (s.tagPresets || DEFAULT_TAGS.slice()) }];
    s.activeTagSetId = 'default';
    delete s.tagPresets;
  }
  // 旧バージョン(メモがmemos配列の構造化データだった頃)の「進行中セッション」だけを
  // 新形式(noteText=連続テキスト)へ移行する。終了済みの履歴セッションはmemos配列の
  // まま残し、詳細画面は従来どおりそちらを表示する(互換維持)。
  // ⚠2026-09-05: コレを入れる前に新形式へ更新すると、進行中セッションの中身が
  // 新UI(noteText前提)では空欄に見えてしまい「メモが消えた」という実害が実際に
  // 起きた(データ自体はmemos配列にまだ残っていて削除はされていなかった)。
  function migrateActiveSessionToNoteText(s){
    if(!s || s.noteText !== undefined) return false;
    var lines = (s.memos || []).slice().sort(function(a,b){ return a.t-b.t; }).map(function(m){
      var tagStr = m.tags && m.tags.length ? ' ['+m.tags.join(' ')+']' : '';
      return formatElapsed(m.t) + ' ' + (m.text||'') + tagStr;
    });
    s.noteText = lines.join('\n');
    delete s.memos;
    return true;
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) throw 0;
      var s = JSON.parse(raw);
      if(!s.sessions) throw 0;
      var migrated = !s.tagSets || !s.tagSets.length;
      migrateTagSets(s);
      if(s.activeSessionId){
        var active = s.sessions.find(function(x){ return x.id===s.activeSessionId; });
        if(migrateActiveSessionToNoteText(active)) migrated = true;
      }
      if(migrated) localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); // 移行結果をその場で書き戻す
      return s;
    }catch(e){
      return freshState();
    }
  }
  var state = loadState();
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function activeTagSet(){
    var set = state.tagSets.filter(function(x){ return x.id===state.activeTagSetId; })[0];
    return set || state.tagSets[0];
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function findSession(id){
    for(var i=0;i<state.sessions.length;i++) if(state.sessions[i].id===id) return state.sessions[i];
    return null;
  }
  function activeSession(){ return state.activeSessionId ? findSession(state.activeSessionId) : null; }

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function formatElapsed(sec){
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if(h>0) return h+':'+pad(m)+':'+pad(s);
    return pad(m)+':'+pad(s);
  }
  function formatDateTime(ms){
    var d = new Date(ms);
    return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function currentElapsedSec(session){
    if(!session) return 0;
    if(session.ytVideoId && ytPlayer && ytPlayerSessionId===session.id && ytElapsedSec!==null){
      return Math.max(0, ytElapsedSec + (session.ytOffsetSec||0));
    }
    var end = session.endedAt || Date.now();
    return Math.floor((end - session.startedAt)/1000);
  }

  // ---------- YouTube連携(任意: 経過時間の自動取得) ----------
  var ytApiState = 'idle'; // idle | loading | ready | error
  var ytApiReadyCallbacks = [];
  var ytPlayer = null;
  var ytPlayerSessionId = null;
  var ytElapsedSec = null;
  var ytPollInterval = null;

  function extractYouTubeId(input){
    input = String(input||'').trim();
    if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    var m = input.match(/(?:youtube\.com\/(?:watch\?v=|live\/|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function loadYouTubeApi(onReady, onFail){
    if(ytApiState==='ready' && window.YT && window.YT.Player){ onReady(); return; }
    ytApiReadyCallbacks.push({ ok: onReady, fail: onFail });
    if(ytApiState==='loading') return;
    ytApiState = 'loading';
    var settled = false;
    function settleFail(msg){
      if(settled) return;
      settled = true;
      ytApiState = 'idle'; // 再試行できるよう状態は戻しておく
      if(msg) showToast(msg);
      var waiters = ytApiReadyCallbacks; ytApiReadyCallbacks = [];
      waiters.forEach(function(w){ if(w.fail) w.fail(); });
    }
    var prevReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){
      if(settled) return;
      settled = true;
      ytApiState = 'ready';
      if(typeof prevReady === 'function') prevReady();
      var waiters = ytApiReadyCallbacks; ytApiReadyCallbacks = [];
      waiters.forEach(function(w){ w.ok(); });
    };
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function(){ settleFail('YouTube APIの読み込みに失敗しました（通信環境をご確認ください）'); };
    document.head.appendChild(tag);
    setTimeout(function(){ settleFail('YouTubeの読み込みがタイムアウトしました。手動モードに戻ります'); }, 12000);
  }

  function destroyYtPlayer(){
    if(ytPollInterval){ clearInterval(ytPollInterval); ytPollInterval=null; }
    if(ytPlayer && ytPlayer.destroy){ try{ ytPlayer.destroy(); }catch(e){} }
    ytPlayer = null; ytPlayerSessionId = null; ytElapsedSec = null;
  }

  // 横長/正方形に近い広い画面では「シアターモード」(動画+チャットを大きく表示)に切り替える。
  var ytTheaterQuery = window.matchMedia('(min-width: 700px)'); // CSS側の@mediaと必ず同じ値にする
  function isTheaterMode(){ return ytTheaterQuery.matches; }

  // シアターモード(広い画面)かつ動画が実際に連携済み(#videoPaneが非表示でない)
  // のときだけ、動画+チャットの2ペイン分割レイアウトを使う。動画未連携のときは
  // #videoPaneごと隠れるので、幅が広いだけの通常(1カラム)表示にする
  // (2026-09-07: 幅だけで判定すると、動画が無いのに#homeViewが空の
  // チャット欄に押し潰されて消えるバグになった)。
  function videoSplitActive(){
    var vp = document.getElementById('videoPane');
    return isTheaterMode() && !!vp && !vp.classList.contains('hidden');
  }

  // 動画連携中の広い画面では操作(タグ行・クイック追加バー・下帯)を丸ごと
  // #videoPane側(チャットの下)へ移動する。それ以外では#appの元の位置
  // (#controlsHomeAnchorの直後)へ戻す(2026-09-06ユーザー指示: チャット欄が
  // 狭くなってもいいから、タップして使う物は画面右のチャットの下に置きたい)。
  function relocateControlsForMode(){
    var group = document.getElementById('controlsGroup');
    var memoCard = document.getElementById('quickMemoCard');
    var memoSlot = document.getElementById('videoPaneMemoSlot');
    var homeView = document.getElementById('homeView');
    var root = document.getElementById('root');
    var split = videoSplitActive();
    if(root) root.classList.toggle('video-split', split);
    if(split){
      // メモカードを動画の下(チャットの反対側)へ、操作一式をその下へ
      // (ユーザー指示2026-09-06: 動画は右上のまま、チャットとメモを入れ替えたい。
      // チャット自体は常に#app側に常駐しているので動かすのはメモカードだけでいい)
      if(memoCard && memoSlot && memoCard.parentElement !== memoSlot) memoSlot.appendChild(memoCard);
      if(group){
        var videoPane = document.getElementById('videoPane');
        if(group.parentElement !== videoPane) videoPane.appendChild(group);
      }
    } else {
      if(memoCard && homeView && memoCard.parentElement !== homeView) homeView.appendChild(memoCard);
      if(group){
        var anchor = document.getElementById('controlsHomeAnchor');
        if(anchor && group.previousElementSibling !== anchor){
          anchor.parentElement.insertBefore(group, anchor.nextSibling);
        }
      }
    }
  }
  ytTheaterQuery.addEventListener('change', function(){
    relocateControlsForMode();
    var s = activeSession();
    renderYtPanel(s);
  });

  function setYtStatus(text){
    var el = document.getElementById('ytStatusText');
    if(el) el.textContent = text;
  }

  function pollYtTime(){
    if(!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
    try{
      var t = ytPlayer.getCurrentTime();
      if(typeof t === 'number' && isFinite(t) && t >= 0){
        ytElapsedSec = Math.floor(t);
        setYtStatus('YouTubeから自動取得中');
        if(currentView==='home') updateTimerDisplay();
      }
    }catch(e){}
  }

  // ⚠動画プレビューはコンパクト/内画面(シアター)どちらも同じ#ytPlayerHostBig
  // 1本(2026-09-07に統一。以前はモードごとに別ホストを持ち、切替のたびに
  // iframeを移動していたが、コレはブラウザ仕様(WHATWG issue #5484)により
  // 既存ノードでも中身がリロードされてしまい、折りたたみ⇄展開でミュートに
  // 戻る不具合の原因になっていた。ホストが1つしかなければ切替自体が発生
  // しないので、この問題ごと構造的に無くなる)。
  function createYtPlayer(session){
    if(!session || !session.ytVideoId) return;
    if(ytPlayer && ytPlayerSessionId===session.id) return; // 既に接続済み
    destroyYtPlayer();
    var host = document.getElementById('ytPlayerHostBig');
    if(!host) return;
    host.innerHTML = '';
    var inner = document.createElement('div');
    host.appendChild(inner);
    setYtStatus('読み込み中…');
    try{
      ytPlayer = new YT.Player(inner, {
        videoId: session.ytVideoId,
        playerVars: { autoplay: 1, mute: 1, playsinline: 1, controls: 1, rel: 0 },
        events: {
          onReady: function(){
            ytPlayerSessionId = session.id;
            if(ytPollInterval) clearInterval(ytPollInterval);
            ytPollInterval = setInterval(pollYtTime, 1000);
            pollYtTime();
          },
          onError: function(){
            showToast('この動画は連携できませんでした。手動モードに戻ります');
            unlinkYouTube(session);
          }
        }
      });
    }catch(err){
      showToast('YouTube連携でエラーが発生しました');
      unlinkYouTube(session);
    }
  }

  function linkYouTube(session, videoId){
    destroyYtPlayer();
    session.ytVideoId = videoId;
    session.ytOffsetSec = session.ytOffsetSec || 0;
    session.url = 'https://www.youtube.com/watch?v=' + videoId; // タイトルと同じく手入力させず自動で紐づける
    save();
    renderYtPanel(session);
  }

  function unlinkYouTube(session){
    destroyYtPlayer();
    if(session){ session.ytVideoId = null; save(); }
    renderYtPanel(session);
  }

  // メモに今回の動画が混ざってしまう。動画の連携=「この配信のメモを始めたい」
  // という意思表示とみなし、今のセッションは閉じて(履歴に残る・データは消えない)
  // 新しいセッションで連携し直す。

  // (2026-09-04、共有経路だけ直して残り2経路を直し忘れる抜けが実際にあった)。

  async function searchYouTube(query){

        encodeURIComponent(query) + '&key=' + encodeURIComponent(state.ytApiKey);
      var res = await fetch(url);

  // 分割画面の切り替えなどでタブが裏に回ると埋め込みプレーヤーが一時停止/停止することがあるため、
  // 表に戻ってきたタイミングで自動的に再生を復帰させる。

  // ---------- PC連携(スマホ→PC拡張機能への片方向自動同期・任意) ----------
  // ⚙設定の「PC連携キー」「PC接続先」が両方入力されているときだけ動く
  // (どちらか空欄なら既定でOFF)。PC側はvoice_input/ws_server.pyのpushMobileNote
  // コマンド(WebSocket・LAN内0.0.0.0:8765で待受)。session.pcSyncedLenを
  // 「PCへ送信済みの文字数」カーソルとして持ち、noteTextの末尾からの増分
  // だけをws_serverへ送る。片方向(PWA→PC)専用でPC側のメモは一切取り込まない。
  // 失敗(自宅WiFi外・PC未起動など)はユーザーに見せず黙って諦め、pcSyncedLenも
  // 進めない→次回Tickで同じ差分を送り直す形で自然にリトライされる。
  var PC_SYNC_INTERVAL_MS = 30000;
  var PC_SYNC_TIMEOUT_MS = 4000;
  var pcSyncBusy = false;

  function pcSyncConfigured(){
    return !!(state.pcSyncKey && state.pcSyncHost);
  }

  function updatePcSyncStatusDisplay(){
    var el = document.getElementById('pcSyncStatusText');
    if(!el) return;
    el.textContent = (pcSyncConfigured() && state.pcLastSyncAt)
      ? '最終同期: ' + formatDateTime(state.pcLastSyncAt)
      : '';
  }

  // 動画IDが紐づいていて、かつ前回送信より本文が増えているセッションだけが対象
  // (YouTube未連携のメモだけのセッションは対象外)。
  function pcSyncEligibleSessions(){
    return state.sessions.filter(function(s){
      return s.ytVideoId && (s.noteText || '').length > (s.pcSyncedLen || 0);
    });
  }

  function pcSyncOneSession(s, cb){
    var diff = (s.noteText || '').slice(s.pcSyncedLen || 0);
    if(!diff.trim()){ cb(); return; } // 差分が空白だけなら送信自体をスキップ
    var settled = false;
    var ws = null;
    var timer = setTimeout(function(){ finish(); }, PC_SYNC_TIMEOUT_MS);
    function finish(){
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      try{ if(ws) ws.close(); }catch(e){}
      cb();
    }
    try{
      ws = new WebSocket('ws://' + state.pcSyncHost);
    }catch(e){ finish(); return; }
    ws.addEventListener('open', function(){
      try{
        ws.send(JSON.stringify({
          cmd: 'pushMobileNote', key: state.pcSyncKey,
          video_id: s.ytVideoId, text: diff, title: s.title || ''
        }));
      }catch(e){ finish(); }
    });
    ws.addEventListener('message', function(ev){
      if(settled) return;
      var data = null;
      try{ data = JSON.parse(ev.data); }catch(e){}
      if(data && data.type === 'pushMobileNoteResult'){
        if(data.ok){
          s.pcSyncedLen = s.noteText.length;
          state.pcLastSyncAt = Date.now();
          save();
          updatePcSyncStatusDisplay();
        }
        finish();
      }
    });
    ws.addEventListener('error', finish);
    ws.addEventListener('close', finish);
  }

  function pcSyncRunQueue(list, done){
    if(!list.length){ done(); return; }
    var s = list.shift();
    pcSyncOneSession(s, function(){ pcSyncRunQueue(list, done); });
  }

  function pcSyncTick(){
    if(pcSyncBusy) return;
    if(document.visibilityState !== 'visible') return;
    if(!pcSyncConfigured()) return;
    var list = pcSyncEligibleSessions();
    if(!list.length) return;
    pcSyncBusy = true;
    pcSyncRunQueue(list, function(){ pcSyncBusy = false; });
  }
  setInterval(pcSyncTick, PC_SYNC_INTERVAL_MS);

  var pcSyncKeyInput = document.getElementById('pcSyncKeyInput');
  var pcSyncHostInput = document.getElementById('pcSyncHostInput');
  document.getElementById('pcSyncSaveBtn').addEventListener('click', function(){
    state.pcSyncKey = pcSyncKeyInput.value.trim();
    state.pcSyncHost = pcSyncHostInput.value.trim();
    save();
    showToast('PC連携の設定を保存しました');
    updatePcSyncStatusDisplay();
  });

  // ---------- Toast ----------
  var toastEl = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  var toastAction = document.getElementById('toastAction');
  var toastTimer = null;
  function showToast(msg, actionLabel, actionFn){

      toastAction.style.display = '';
      toastAction.textContent = actionLabel;
      toastAction.onclick = function(){ actionFn(); hideToast(); };
    } else {
      toastAction.style.display = 'none';
      toastAction.onclick = null;
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4000);

  // ---------- ナビゲーション ----------
  var views = { home: document.getElementById('homeView'), history: document.getElementById('historyView'), detail: document.getElementById('detailView') };
  var navBtns = document.querySelectorAll('.navchip[data-view]');

    document.getElementById('quickMemoCard').classList.toggle('hidden', name!=='home');

  // ---------- ホーム画面 ----------
  // 1配信=1つの連続テキスト(session.noteText)。Chrome拡張機能と同じ考え方で、
  // 個別メモのカード・一覧・編集シートは持たない。🕐は今のカーソル位置に
  // 時刻を挿入するだけ(タグ挿入と全く同じ仕組み)。何かを書いた瞬間に
  // セッションが無ければ自動で作る(ensureActiveSession)ので、下書き専用の
  // 領域(旧draftText)も不要。
  var quickTagsWrap = document.getElementById('quickTagsWrap');
  var quickMemoTextEl = document.getElementById('quickMemoText');

  function ensureActiveSession(){
    var s = activeSession();
    if(s) return s;
    var now = new Date();
    s = {
      id: uid(),
      title: '配信 ' + (now.getMonth()+1) + '/' + now.getDate() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
      url: '',
      startedAt: Date.now(),
      endedAt: null,
      noteText: '',
      pcSyncedLen: 0
    };
    state.sessions.push(s);
    state.activeSessionId = s.id;
    save();
    return s;

  quickMemoTextEl.addEventListener('input', function(){

  function renderHome(){
    var s = activeSession();
    updateTimerDisplay();

    renderYtPanel(s);

  // ⚠prompt()は使わない。ブラウザのネイティブダイアログはJS実行を止めるため、
  // 連携中のYouTube動画の音声/再生が乱れることがある(2026-09-07実機報告)。
  // クイック追加バーと同じ「その場でinput→Enter/ボタンで確定」に統一する。
  var addingQuickTag = false;
  var renamingQuickTagIdx = -1;
  // ワードボタンの長押し→その場で名前編集。⚠ここもprompt()は使わない
  // (動画の映像/音声を止めないよう、上のクイック追加バー・+追加チップと
  // 同じinput方式に統一する。2026-09-07ユーザー指示)。
  var QUICK_TAG_LONG_PRESS_MS = 500;
  function renderQuickTags(container, onTap){
    if(renamingQuickTagIdx>=0){
      var set0 = activeTagSet();
      var oldName = set0.tags[renamingQuickTagIdx];
      if(oldName===undefined){ renamingQuickTagIdx = -1; renderQuickTags(container, onTap); return; }
      var html0 = activeTagSet().tags.map(function(t, i){
        if(i===renamingQuickTagIdx){
          return '<input type="text" id="renameQuickTagInline" value="'+escapeAttr(t)+'" style="flex:1 1 auto; min-width:100px; padding:9px 12px; border-radius:999px; font-size:13.5px;">' +
            '<button type="button" class="chip" id="renameQuickTagConfirm">確定</button>' +
            '<button type="button" class="chip" id="renameQuickTagCancel">×</button>';
        }
        return '<button class="chip" data-tag="'+escapeAttr(t)+'">'+escapeHtml(t)+'</button>';
      }).join('');
      html0 += '<button type="button" class="chip add" id="quickAddTagChip">＋追加</button>';
      container.innerHTML = html0;
      var rInput = document.getElementById('renameQuickTagInline');
      function commitRename(){
        var t = rInput.value.trim();
        var set = activeTagSet();
        if(t && set.tags.indexOf(t)===-1){ set.tags[renamingQuickTagIdx] = t; save(); }
        renamingQuickTagIdx = -1;
        renderQuickTags(container, onTap);
      }
      function cancelRename(){ renamingQuickTagIdx = -1; renderQuickTags(container, onTap); }
      document.getElementById('renameQuickTagConfirm').addEventListener('click', commitRename);
      document.getElementById('renameQuickTagCancel').addEventListener('click', cancelRename);
      rInput.addEventListener('keydown', function(e){
        if(e.key==='Enter'){ e.preventDefault(); commitRename(); }
        if(e.key==='Escape'){ cancelRename(); }
      });
      rInput.focus();
      rInput.select();
      // 編集中でない他のチップ・+追加は普通にタップで使えるままにする
      container.querySelectorAll('.chip[data-tag]').forEach(function(el){
        el.addEventListener('click', function(){ onTap(el.dataset.tag); });
      });
      var addChip0 = document.getElementById('quickAddTagChip');
      if(addChip0) addChip0.addEventListener('click', function(){
        addingQuickTag = true;
        renderQuickTags(container, onTap);
      });
      return;
    }
    if(addingQuickTag){
      container.innerHTML =
        '<input type="text" id="newQuickTagInline" placeholder="新しいクイックワード" style="flex:1 1 auto; min-width:100px; padding:9px 12px; border-radius:999px; font-size:13.5px;">' +
        '<button type="button" class="chip" id="newQuickTagConfirm">追加</button>' +
        '<button type="button" class="chip" id="newQuickTagCancel">×</button>';
      var input = document.getElementById('newQuickTagInline');
      function commit(){
        var t = input.value.trim();
        if(t){
          var set = activeTagSet();
          if(set.tags.indexOf(t)===-1) set.tags.push(t);
          save();
        }
        addingQuickTag = false;
        renderQuickTags(container, onTap);
      }
      function cancel(){ addingQuickTag = false; renderQuickTags(container, onTap); }
      document.getElementById('newQuickTagConfirm').addEventListener('click', commit);
      document.getElementById('newQuickTagCancel').addEventListener('click', cancel);
      input.addEventListener('keydown', function(e){
        if(e.key==='Enter'){ e.preventDefault(); commit(); }
        if(e.key==='Escape'){ cancel(); }
      });
      input.focus();
      return;
    }
    var html = activeTagSet().tags.map(function(t, i){
      return '<button type="button" class="chip" data-tag="'+escapeAttr(t)+'" data-idx="'+i+'">'+escapeHtml(t)+'</button>';
    }).join('');
    html += '<button type="button" class="chip add" id="quickAddTagChip">＋追加</button>';
    container.innerHTML = html;
    container.querySelectorAll('.chip[data-tag]').forEach(function(el){
      // タップ=スタンプ挿入、長押し=その場で名前編集。長押しが発火した回だけ
      // タップ側(click)を無効化する(⚙長押し更新ボタンと同じガード方式)。
      var pressTimer = null;
      var longPressFired = false;
      function start(){
        longPressFired = false;
        clearTimeout(pressTimer);
        el.classList.add('pressing');
        pressTimer = setTimeout(function(){
          longPressFired = true;
          el.classList.remove('pressing');
          if(navigator.vibrate) navigator.vibrate(15);
          renamingQuickTagIdx = parseInt(el.dataset.idx, 10);
          renderQuickTags(container, onTap);
        }, QUICK_TAG_LONG_PRESS_MS);
      }
      function cancelHold(){
        clearTimeout(pressTimer);
        el.classList.remove('pressing');
      }
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', cancelHold);
      el.addEventListener('pointerleave', cancelHold);
      el.addEventListener('pointercancel', cancelHold);
      el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
      el.addEventListener('click', function(e){
        if(longPressFired){ longPressFired = false; e.preventDefault(); return; }
        onTap(el.dataset.tag);
      });
    });
    var addChip = document.getElementById('quickAddTagChip');
    if(addChip) addChip.addEventListener('click', function(){
      addingQuickTag = true;
      renderQuickTags(container, onTap);
    });
  }

  // タグ(スタンプ)ボタン＝押した瞬間のタイムスタンプ付きで末尾に追記する
  // (🕐・クイック追加バーと同じ「常に末尾へ」方式。ユーザー指示:
  // スタンプを押したときも同時にタイムスタンプを記録してほしい)。
  // "◆◇"だけは中身が空のテンプレートなので、◆と◇の間にカーソルを置いて
  // そのまま打ち込める状態にする。それ以外は追記した直後にカーソルを置く。
  function insertTagTemplate(tagName){
    var s = ensureActiveSession();
    var t = currentElapsedSec(s);
    appendLine(formatElapsed(t) + ' ' + tagName);
    var el = quickMemoTextEl;
    if(tagName === '◆◇') el.setSelectionRange(el.value.length-1, el.value.length-1);
    el.focus();
  }

  // 常に末尾へ追記する共通処理(ユーザー指示: 自分でスクロールしなくていいように)。
  // カーソル位置に挿入すると、途中を見返している時に混ざってしまい、しかも
  // 一番下(追記した本人が見たい場所)が画面外になってしまう。
  // 🕐(裸の時刻だけ挿入して続けて書く)・クイック追加バー(1行入力→Enterで
  // 確定)の両方がコレを使う。
  function appendLine(text){
    var el = quickMemoTextEl;
    var needsNewline = el.value.length > 0 && el.value.charAt(el.value.length-1) !== '\n';
    el.value += (needsNewline ? '\n' : '') + text;
    el.setSelectionRange(el.value.length, el.value.length);
    el.scrollTop = el.scrollHeight;
    el.dispatchEvent(new Event('input', {bubbles:true}));
  }

  // 🕐＝今の再生位置を裸のテキストとして末尾に追記するだけ(拡張機能のAlt+Tと
  // 同じ)。モーダルも一覧遷移も無く、押した瞬間からそのまま続けて書ける。
  function stampQuickMemo(){
    var s = ensureActiveSession();
    var t = currentElapsedSec(s);
    appendLine(formatElapsed(t) + ' ');
    quickMemoTextEl.focus();
  }

  // クイック追加バー(PC版ymmp_gui_new.pyの配信メモ入力欄と同じ考え方)。
  // 1行書いてEnter/追加ボタンで、タイムスタンプ付きの1行として末尾に確定し、
  // 欄はクリアされて次を打てる。ゲスト用は[ゲスト]の印を付けて区別する。
  function submitQuickAdd(inputEl, prefix){
    var text = inputEl.value.trim();
    if(!text) return;
    var s = ensureActiveSession();
    var t = currentElapsedSec(s);
    appendLine(formatElapsed(t) + ' ' + (prefix ? prefix + ' ' : '') + text);
    inputEl.value = '';
    inputEl.focus(); // 連続入力しやすいよう欄に留まる(テキストエリアへは移さない)
  }
  var quickAddMemoInput = document.getElementById('quickAddMemoInput');
  var quickAddGuestInput = document.getElementById('quickAddGuestInput');
  document.getElementById('quickAddMemoBtn').addEventListener('click', function(){ submitQuickAdd(quickAddMemoInput, null); });
  quickAddMemoInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitQuickAdd(quickAddMemoInput, null); } });
  document.getElementById('quickAddGuestBtn').addEventListener('click', function(){ submitQuickAdd(quickAddGuestInput, '[ゲスト]'); });
  quickAddGuestInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitQuickAdd(quickAddGuestInput, '[ゲスト]'); } });

  function renderMemoItems(container, memos, onTap){
    if(!memos.length){
      container.innerHTML = '<div class="empty-state">まだメモがありません。書いて、右下のタイムスタンプボタンで記録しましょう。</div>';
      return;
    }
    var sorted = memos.slice().sort(function(a,b){ return a.t-b.t; });
    container.innerHTML = sorted.map(function(m){
      var tagsHtml = m.tags && m.tags.length
        ? '<div class="memo-tags">' + m.tags.map(function(t){ return '<span class="tag-pill">'+escapeHtml(t)+'</span>'; }).join('') + '</div>'
        : '';
      var textHtml = m.text
        ? '<div class="memo-text">'+escapeHtml(m.text)+'</div>'
        : '<div class="memo-text empty">（本文なし）</div>';
      return '<div class="memo-item" data-id="'+m.id+'">' +
        '<div class="memo-row"><div class="memo-t">'+formatElapsed(m.t)+'</div>'+textHtml+'</div>' +
        tagsHtml +
        '</div>';
    }).join('');
    container.querySelectorAll('.memo-item').forEach(function(el){
      el.addEventListener('click', function(){
        var m = memos.find(function(x){ return x.id===el.dataset.id; });
        if(m) onTap(m);
      });
    });
  }

  var timerInterval = setInterval(function(){
    if(currentView==='home') updateTimerDisplay();
  }, 500);
  function updateTimerDisplay(){
    var s = activeSession();
    var sec = s ? currentElapsedSec(s) : 0;
    var sheetEl = document.getElementById('timerDisplay');
    if(sheetEl) sheetEl.textContent = formatElapsed(sec);
  }

  function endActiveSession(){
    var s = activeSession();
    if(!s) return false;
    if(!confirm('配信を終了して履歴に保存します。よろしいですか？')) return false;
    endActiveSessionCore(s);
    renderHome();
    showToast('配信メモを保存しました');
    return true;
  }
  // 確認ダイアログ無しの版。共有起動時など、確認を挟まず自動でセッションを
  // 閉じたい場面向け(履歴には残るのでデータは消えない)。
  function endActiveSessionCore(s){
    s.endedAt = Date.now();
    state.activeSessionId = null;
    destroyYtPlayer();
    save();
  }

  // ---------- 設定シート ----------
  var sessionSheet = document.getElementById('sessionSheet');

  function openSessionSheet(){
    var s = activeSession();
    document.getElementById('endSessionBtn').style.display = s ? '' : 'none';
    document.getElementById('swapPanesToggle').checked = !!state.swapPanes;
    updateTimerDisplay();
    renderTagSetList();
    renderTagManageList();
    pcSyncKeyInput.value = state.pcSyncKey || '';
    pcSyncHostInput.value = state.pcSyncHost || '';
    updatePcSyncStatusDisplay();
    document.getElementById('ytApiKeyRow').classList.add('hidden');
    document.getElementById('ytSearchResults').innerHTML = '';
    document.getElementById('ytSearchInput').value = '';
    sessionSheet.classList.remove('hidden');
  }
  function closeSessionSheet(){ sessionSheet.classList.add('hidden'); }

  // ---------- ワードボタンのセット管理 ----------
  // 複数のセットを登録しておき、「セット」ボタンで押した1つだけがメモ下のタグ帯に出る。
  function renderTagSetList(){
    var wrap = document.getElementById('tagSetList');
    if(!wrap) return;
    wrap.innerHTML = state.tagSets.map(function(set){
      var active = set.id === state.activeTagSetId;
      return '<div class="tag-set-row'+(active?' active':'')+'">' +
        '<span class="tag-set-name">'+escapeHtml(set.name)+(active?' ✓':'')+'</span>' +
        '<div class="tag-set-actions">' +
          (active ? '' : '<button type="button" class="btn tag-set-apply" data-id="'+set.id+'">セット</button>') +
          (state.tagSets.length>1 ? '<button type="button" class="tag-manage-del" data-setdel="'+set.id+'" aria-label="セットを削除">×</button>' : '') +
        '</div></div>';
    }).join('');
    wrap.querySelectorAll('.tag-set-apply').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.activeTagSetId = btn.dataset.id;
        save();
        renderTagSetList();
        renderTagManageList();
        if(currentView==='home') renderQuickTags(quickTagsWrap, insertTagTemplate);
      });
    });
    wrap.querySelectorAll('[data-setdel]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = state.tagSets.findIndex(function(x){ return x.id===btn.dataset.setdel; });
        if(idx<0) return;
        if(!confirm('「'+state.tagSets[idx].name+'」を削除しますか？（中のタグも消えます）')) return;
        var wasActive = state.tagSets[idx].id === state.activeTagSetId;
        state.tagSets.splice(idx, 1);
        if(wasActive) state.activeTagSetId = state.tagSets[0].id;
        save();
        renderTagSetList();
        renderTagManageList();
        if(currentView==='home') renderQuickTags(quickTagsWrap, insertTagTemplate);
      });
    });
  }
  document.getElementById('addTagSetBtn').addEventListener('click', function(){
    var input = document.getElementById('newTagSetInput');
    var name = input.value.trim();
    if(!name) return;
    state.tagSets.push({ id: uid(), name: name, tags: [] });
    input.value = '';
    save();
    renderTagSetList();
  });

  // ---------- 選択中セットの中身(タグ)の管理 ----------
  function renderTagManageList(){
    var wrap = document.getElementById('tagManageList');
    if(!wrap) return;
    var set = activeTagSet();
    var nameEl = document.getElementById('activeTagSetName');
    if(nameEl) nameEl.textContent = set.name;
    wrap.innerHTML = set.tags.map(function(t, i){
      return '<div class="tag-manage-row">' +
        '<span class="tag-manage-text">'+escapeHtml(t)+'</span>' +
        '<button type="button" class="tag-manage-del" data-idx="'+i+'" aria-label="削除">×</button>' +
        '</div>';
    }).join('');
    wrap.querySelectorAll('.tag-manage-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.dataset.idx, 10);
        activeTagSet().tags.splice(idx, 1);
        save();
        renderTagManageList();
        if(currentView==='home') renderQuickTags(quickTagsWrap, insertTagTemplate);
      });
    });
  }
  document.getElementById('addPresetTagBtn').addEventListener('click', function(){
    var input = document.getElementById('newPresetTagInput');
    var t = input.value.trim();
    if(!t) return;
    var set = activeTagSet();
    if(set.tags.indexOf(t)===-1) set.tags.push(t);
    input.value = '';
    save();
    renderTagManageList();
    if(currentView==='home') renderQuickTags(quickTagsWrap, insertTagTemplate);
  });

  // ⚙設定ボタンの1.5秒長押しで、最新版を強制的に取り直す(イズレ/アシアト同様のパターン)。
  // このアプリはService Workerがキャッシュ優先＋裏で新版取得なので、放っておくと
  // 「更新は次回起動時にしか反映されない」。今すぐ最新にしたい場合の脱出口として用意する。
  (function(){
    var btn = document.getElementById('settingsBtn');
    var LONG_PRESS_MS = 1500;
    var pressTimer = null;
    var longPressFired = false;

    async function forceUpdate(){
      showToast('最新版を取得しています…');
      try{
        if('caches' in window){
          var keys = await caches.keys();
          await Promise.all(keys.map(function(k){ return caches.delete(k); }));
        }
        if('serviceWorker' in navigator){
          // updateだけだと登録済みのSW自体は残るため、古い版がfetchを
          // 処理し続けるコトがある。登録解除まで行い、次回読み込みで
          // 完全にゼロから登録し直させる。
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r){ return r.unregister(); }));
        }
      }catch(e){ /* 取得に失敗しても、とりあえずリロードだけは試みる */ }
      // ⚠GitHub Pagesはindex.htmlに Cache-Control: max-age=600 (10分)を
      // 付けて配信している。Service Worker/Cache Storageを全部消しても、
      // コレはブラウザのHTTPキャッシュ(別物)なので、素の location.reload()
      // では10分以内のpush直後に更新してもキャッシュ済みの古い版が返って
      // しまう不具合が実際にあった(2026-09-06実機発覚)。クエリを変えて
      // 別URL扱いにし、HTTPキャッシュを確実に迂回する。
      location.href = location.pathname + '?_upd=' + Date.now();
    }

    function startPress(){
      longPressFired = false;
      clearTimeout(pressTimer);
      btn.classList.add('pressing');
      pressTimer = setTimeout(function(){
        longPressFired = true;
        btn.classList.remove('pressing');
        if(navigator.vibrate) navigator.vibrate(30);
        forceUpdate();
      }, LONG_PRESS_MS);
    }
    function cancelPress(){
      clearTimeout(pressTimer);
      btn.classList.remove('pressing');
    }
    btn.addEventListener('pointerdown', startPress);
    btn.addEventListener('pointerup', cancelPress);
    btn.addEventListener('pointerleave', cancelPress);
    btn.addEventListener('pointercancel', cancelPress);
    btn.addEventListener('click', function(e){
      if(longPressFired){ longPressFired = false; e.preventDefault(); return; }
      openSessionSheet();
    });
  })();

  document.getElementById('endSessionBtn').addEventListener('click', function(){
    if(endActiveSession()) closeSessionSheet();
  });
  document.getElementById('cancelSessionBtn').addEventListener('click', closeSessionSheet);
  sessionSheet.querySelector('.sheet-backdrop').addEventListener('click', closeSessionSheet);

  // ---------- 分割表示のレイアウト入れ替え(フローティングキーボード対策) ----------
  function applySwapPanes(){
    document.getElementById('root').classList.toggle('swap-panes', !!state.swapPanes);
  }
  applySwapPanes();
  document.getElementById('swapPanesToggle').addEventListener('change', function(){
    state.swapPanes = this.checked;
    save();
    applySwapPanes();
  });

  document.getElementById('recordBtn').addEventListener('click', stampQuickMemo);

  // ---------- 履歴画面 ----------
  var sessionListEl = document.getElementById('sessionList');
  function renderHistory(){
    var list = state.sessions.slice().sort(function(a,b){ return b.startedAt-a.startedAt; });
    if(!list.length){
      sessionListEl.innerHTML = '<div class="empty-state">まだ履歴はありません。</div>';
      return;
    }
    sessionListEl.innerHTML = list.map(function(s){
      var isLive = s.id===state.activeSessionId;
      var dur = formatElapsed(currentElapsedSec(s));
      return '<div class="session-row" data-id="'+s.id+'">' +
        '<div class="t1">'+escapeHtml(s.title)+(isLive?' <span class="live">● 記録中</span>':'')+'</div>' +
        '<div class="t2">'+formatDateTime(s.startedAt)+' ・ '+dur+' ・ '+memoCountLabel(s)+'</div>' +
        '</div>';
    }).join('');
    sessionListEl.querySelectorAll('.session-row').forEach(function(el){
      el.addEventListener('click', function(){
        detailSessionId = el.dataset.id;
        showView('detail');
      });
    });
  }

  // ---------- 詳細画面 ----------
  var detailHeader = document.getElementById('detailHeader');
  var detailMemoList = document.getElementById('detailMemoList');
  document.getElementById('backToHistoryBtn').addEventListener('click', function(){ showView('history'); });

  // 新形式(noteText=1つの連続テキスト)と旧形式(memos=構造化された配列)の
  // 両方を扱う小さなヘルパー。旧セッションの履歴閲覧との互換のため両対応する。
  function memoCountLabel(s){
    if(s.noteText !== undefined){
      var lines = (s.noteText || '').split('\n').filter(function(l){ return l.trim(); });
      return lines.length + '行';
    }
    return 'メモ' + s.memos.length + '件';
  }
  function buildExportText(s){
    var lines = [];
    lines.push('■ ' + s.title);
    if(s.url) lines.push(s.url);
    lines.push(formatDateTime(s.startedAt) + ' 開始');
    lines.push('');
    if(s.noteText !== undefined){
      lines.push(s.noteText);
    } else {
      s.memos.slice().sort(function(a,b){ return a.t-b.t; }).forEach(function(m){
        var tagStr = m.tags && m.tags.length ? ' ['+m.tags.join(' ')+']' : '';
        lines.push(formatElapsed(m.t) + ' ' + m.text + tagStr);
      });
    }
    return lines.join('\n');
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('コピーしました');
      }).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); showToast('コピーしました'); }catch(e){ showToast('コピーに失敗しました'); }
    document.body.removeChild(ta);
  }

  function renderDetail(){
    var s = findSession(detailSessionId);
    if(!s){ showView('history'); return; }
    var isLive = s.id===state.activeSessionId;
    detailHeader.innerHTML =
      '<div class="session-title">'+escapeHtml(s.title)+(isLive?' <span class="live" style="font-size:13px;">● 記録中</span>':'')+'</div>' +
      (s.url ? '<div class="session-url">'+escapeHtml(s.url)+'</div>' : '') +
      '<div class="session-hint" style="margin-top:8px;">'+formatDateTime(s.startedAt)+' 開始 ・ 長さ '+formatElapsed(currentElapsedSec(s))+' ・ '+memoCountLabel(s)+'</div>' +
      '<div class="detail-actions">' +
        '<button class="btn" id="copyBtn">📋 テキストをコピー</button>' +
        (isLive ? '' : '<button class="btn danger" id="deleteSessionBtn">この配信メモを削除</button>') +
      '</div>';
    document.getElementById('copyBtn').addEventListener('click', function(){ copyToClipboard(buildExportText(s)); });
    var delBtn = document.getElementById('deleteSessionBtn');
    if(delBtn){
      delBtn.addEventListener('click', function(){
        if(confirm('この配信のメモをすべて削除します。よろしいですか？')){
          var idx = state.sessions.findIndex(function(x){ return x.id===s.id; });
          if(idx>=0) state.sessions.splice(idx,1);
          save();
          showView('history');
        }
      });
    }
    if(s.noteText !== undefined){
      detailMemoList.innerHTML = '<div class="detail-note-text">' + (s.noteText ? escapeHtml(s.noteText) : '<span class="empty-state">まだ何も書かれていません。</span>') + '</div>';
    } else {
      renderMemoItems(detailMemoList, s.memos, function(){ /* 履歴内は閲覧のみ(旧形式) */ });
    }
  }

  // ---------- ヘルプ ----------
  document.getElementById('helpBtn').addEventListener('click', function(){
    alert(
      '【使い方】\n' +
      '・上のテキスト欄に配信を見ながら自由に書いていきます（配信は書き始めた瞬間に自動で始まります）。右下のタイムスタンプボタン（🕐）を押すと、今のカーソル位置に現在の時刻が挿入されるだけです。一覧やダイアログは開かず、そのまま続けて書けます。\n' +
      '・タグをタップすると、メモ欄のカーソル位置にそのタグを挿入します（🕐と同じ仕組み）。「◆◇」はカーソルが◆と◇の間に来るので、そのまま中身を打ち込めます。タグは⚙設定の「クイックタグ」から自由に追加・削除できます。\n' +
      '・⚙（設定）は下帯の右端。YouTube連携の状態確認・連携解除、配信の終了はここから。\n' +
      '・⚙設定のYouTube連携欄にURLを貼るか、キーワードで検索して一覧から選ぶと、配信の再生位置から経過時間を自動取得します（通信が必要・右上に小さく動画が出ます）。検索にはAPIキーの登録が別途必要（「検索用APIキーを設定」から）。ズレを感じたら±5秒で微調整できます。タイトルとURLは連携内容から自動で決まるので手入力は不要です。\n' +
      '・画面が横長・正方形に近いくらい広いとき（分割画面など）は、左に動画とチャット、右にメモという2ペイン表示に自動で切り替わります。動画は音量ミュートで始まるので、必要ならプレーヤー上のボタンでミュート解除してください。\n' +
      '・「📚」から過去の配信メモを見返したり、テキストとしてコピーできます。\n' +
      '・画面が古いままだと感じたら、⚙を1.5秒長押しすると強制的に最新版を取得して再読み込みします。\n' +
      '・データはこの端末内だけに保存されます（他の端末とは同期しません）。'
    );
  });

  // ---------- ユーティリティ ----------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeAttr(str){ return escapeHtml(str); }

  // ---------- 共有起動(YouTubeアプリの「共有」→配信メモ。Android殻が?yt=<動画ID>を付けて起動する) ----------
  (function handleSharedYouTubeLink(){
    try{
      var id = extractYouTubeId(new URLSearchParams(location.search).get('yt'));
      if(!id) return;
      var switching = linkYouTubeAsSession(id);
      showToast(switching ? '新しい配信メモを始めました' : '共有された動画と連携しました');
      history.replaceState(null, '', location.pathname); // 再読み込み時に再実行しないようクエリを消す
    }catch(e){}
  })();

  // ---------- 初期化 ----------
  relocateControlsForMode(); // 起動時点で内画面ならチャットの下に操作を出しておく
  showView('home');

  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>
